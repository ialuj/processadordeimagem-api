logging.level.org.springframework=DEBUG
logging.level.org.springframework.boot=DEBUG

# Configuracao do DataSource
spring.datasource.url=jdbc:mariadb://localhost:3333/processador_imagem_db
spring.datasource.username=root
spring.datasource.password=root

# Driver JDBC do MariaDB
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate JPA (opcional, mas recomendado para configuracoes de ORM)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Pool de Conexoes (HikariCP eh o padrao no Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

